name: Atualizar dados e publicar site

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3): 07:17, 11:17, 14:17 (após a PTAX) e 19:17.
    # Segunda a quarta também às 16:47, quando a ANP costuma publicar a pesquisa da semana.
    - cron: "17 10 * * *"
    - cron: "17 14 * * *"
    - cron: "17 17 * * *"
    - cron: "17 22 * * *"
    - cron: "47 19 * * 1-3"
  workflow_dispatch:   # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths-ignore: ["dados/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar tudo em paralelo (ANP, Banco Central, moedas, ANEEL)
        run: |
          python robo/coletar_anp.py    > anp.log 2>&1 & a=$!
          python robo/coletar_bcb.py    > bcb.log 2>&1 & b=$!
          python robo/coletar_moedas.py > moe.log 2>&1 & c=$!
          python robo/coletar_aneel.py  > ane.log 2>&1 & d=$!
          for p in $a $b $c $d; do wait $p || echo "::warning::um coletor falhou (pid $p)"; done
          for f in anp bcb moe ane; do echo "::group::$f"; cat $f.log; echo "::endgroup::"; done
          rm -f *.log

      - name: Guardar os dados novos no repositório
        run: |
          git config user.name "robo-bolso-hoje"
          git config user.email "robo@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "Dados atualizados em $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 15
            done
          fi

      - name: Gerar o site
        run: python robo/gerar_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Cancelar publicação anterior travada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=5" -q '.[].sha'); do
            if [ "$sha" != "$GITHUB_SHA" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelada: $sha" || true
            fi
          done
        continue-on-error: true

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000

      - name: Avisar buscadores (IndexNow - Bing, Yandex e outros)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 14 * * *' || github.event.schedule == '47 19 * * 1-3'
        continue-on-error: true
        run: |
          sleep 60
          curl -fsS https://bolsohoje.com.br/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | head -n 10000 > urls.txt
          python3 -c "import json;u=open('urls.txt').read().split();print(json.dumps({'host':'bolsohoje.com.br','key':'abec578a1f121d37c607047dbd2212c9','keyLocation':'https://bolsohoje.com.br/abec578a1f121d37c607047dbd2212c9.txt','urlList':u}))" > corpo.json
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code} ($(wc -l < urls.txt) endereços)\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @corpo.json
