name: Coletar Tabela FIPE

on:
  schedule:
    # Todo dia de manhã (UTC): pega a tabela nova assim que o dataset publicar.
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fipe
  cancel-in-progress: false

jobs:
  fipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar
        run: python robo/coletar_fipe.py

      - name: Guardar o progresso
        run: |
          git config user.name "robo-bolso-hoje"
          git config user.email "robo@users.noreply.github.com"
          git add dados/fipe
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "FIPE: tabela atualizada $(date -u +'%Y-%m-%d') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 15
          done
          exit 1
