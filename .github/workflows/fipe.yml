name: Coletar Tabela FIPE

on:
  schedule:
    # Duas vezes por dia, em horários sem a outra coleta (UTC).
    - cron: "41 4 * * *"
    - cron: "41 15 * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de coleta nesta execução"
        default: "25"

permissions:
  contents: write

concurrency:
  group: fipe
  cancel-in-progress: false

jobs:
  fipe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar
        env:
          FIPE_MINUTOS: ${{ github.event.inputs.minutos || '25' }}
        run: python robo/coletar_fipe.py

      - name: Guardar o progresso
        run: |
          git config user.name "robo-bolso-hoje"
          git config user.email "robo@users.noreply.github.com"
          git add dados/fipe
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "FIPE: progresso da coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 15
          done
          exit 1
